name: Release

# On every push to main (i.e. every merged PR):
# 1. run the full CI pipeline
# 2. semantic-release (dreitier/shared-ci-components/semantic-release) derives the next version from the
#    Conventional Commits since the last tag, updates CHANGELOG.md, pushes the release commit + tag and
#    creates the GitHub release. Nothing happens for non-releasing commits (docs, ci, chore, ...).
# 3. the image is pushed to GHCR, signed with cosign and attested; its CycloneDX SBOM goes to
#    Dependency-Track (organization secret DEPENDENCYTRACK_API_KEY).
# basement's Renovate picks up the new version for the ARC runner scale sets.
on:
  push:
    branches:
      - main
  # re-run a release attempt manually, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: read

# never run two releases at the same time, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dreitier/actions-runner-tofu

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    # all writes use the GitHub App token (release bot)
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run semantic-release
        id: release
        uses: dreitier/shared-ci-components/semantic-release@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # exactly the existing header of CHANGELOG.md – another title would be added on top of it
          changelog-title: "# Changelog\n\nAll notable changes to this project are documented in this file. It is generated by [semantic-release](https://github.com/semantic-release/semantic-release) from [Conventional Commits](https://www.conventionalcommits.org/) and follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."

  image:
    name: Docker image
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 -> 1.2.3, 1.2, 1, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # keyless Sigstore signature (GitHub OIDC identity of this workflow), verifiable with `cosign verify`
      - name: Sign image
        uses: dreitier/shared-ci-components/cosign-sign@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          images: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # CycloneDX SBOM of the released image → Dependency-Track (project actions-runner-tofu, version = release).
  # A separate job: a Dependency-Track outage must not fail the release. The image is public – no login.
  sbom:
    name: SBOM → Dependency-Track
    needs: [semantic-release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate SBOM
        id: sbom
        uses: dreitier/shared-ci-components/sbom@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          image: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}

      - name: Upload to Dependency-Track
        uses: dreitier/shared-ci-components/dependency-track-upload@1ba590342248df7855a136be3420378586d139d6 # v1.2.0
        with:
          api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          bom: ${{ steps.sbom.outputs.file }}
          project-name: actions-runner-tofu
          project-version: ${{ needs.semantic-release.outputs.version }}
